<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications · Forth Lab · RPI</title>
<meta name="description" content="Publications from the Forth Lab at Rensselaer Polytechnic Institute, updated automatically from Google Scholar.">
<style>
  :root {
    --bg: #fbfaf8;
    --surface: #ffffff;
    --ink: #1c1d21;
    --ink-2: #4a4d55;
    --ink-3: #7c808a;
    --rule: #e7e4df;
    --accent: #b3122e;          /* RPI red */
    --accent-soft: #fbeef0;
    --chip: #f2f0ec;
    --radius: 14px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --surface: #1a1b1f;
      --ink: #ecebe8;
      --ink-2: #b9bbc2;
      --ink-3: #868a94;
      --rule: #2a2c32;
      --accent: #ff5a6e;
      --accent-soft: #2a1a1e;
      --chip: #23252b;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header { padding: 72px 0 36px; border-bottom: 1px solid var(--rule); }
  .eyebrow {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); font-weight: 650; margin: 0 0 12px;
  }
  h1 {
    font-family: var(--serif); font-weight: 600; letter-spacing: -.01em;
    font-size: clamp(34px, 5vw, 50px); line-height: 1.08; margin: 0 0 10px;
  }
  .affil { color: var(--ink-2); margin: 0; font-size: 17px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .stat {
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 14px 18px; min-width: 128px;
  }
  .stat b { display: block; font-size: 26px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--ink-3); }
  .scholar-link {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 20px;
    font-size: 14px; color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule);
  }
  .scholar-link:hover { color: var(--accent); border-color: var(--accent); }

  /* Toolbar */
  .toolbar {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .toolbar .wrap { display: flex; gap: 12px; align-items: center; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
  .search {
    flex: 1 1 260px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 9px 16px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { flex: none; color: var(--ink-3); }
  .search input { border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; width: 100%; }
  .sortbtns { display: flex; background: var(--chip); border-radius: 999px; padding: 3px; }
  .sortbtns button {
    border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 14px;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  .sortbtns button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .count { font-size: 14px; color: var(--ink-3); white-space: nowrap; }

  .years { display: flex; gap: 6px; flex-wrap: wrap; padding: 22px 0 4px; }
  .years a {
    font-size: 13px; text-decoration: none; color: var(--ink-2); background: var(--chip);
    padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .years a:hover { background: var(--accent-soft); color: var(--accent); }

  /* List */
  main { padding: 12px 0 64px; }
  .year-group { display: grid; grid-template-columns: 88px 1fr; gap: 0 24px; padding-top: 28px; scroll-margin-top: 80px; }
  .year-label {
    font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--ink-3);
    position: sticky; top: 86px; align-self: start; padding-top: 14px; font-variant-numeric: lining-nums;
  }
  .pubs { list-style: none; margin: 0; padding: 0; }
  .pub {
    padding: 16px 0; border-bottom: 1px solid var(--rule);
    display: grid; grid-template-columns: 1fr auto; gap: 4px 20px;
  }
  .pub:last-child { border-bottom: 0; }
  .pub-title {
    font-family: var(--serif); font-size: 19px; line-height: 1.32; font-weight: 600; margin: 0;
    grid-column: 1;
  }
  .pub-title a { text-decoration: none; background-image: linear-gradient(var(--accent), var(--accent)); background-size: 0 1px; background-repeat: no-repeat; background-position: 0 100%; transition: background-size .25s; }
  .pub-title a:hover { background-size: 100% 1px; color: var(--accent); }
  .pub-authors { grid-column: 1; margin: 0; color: var(--ink-2); font-size: 14.5px; }
  .pub-authors strong { color: var(--ink); font-weight: 650; }
  .pub-venue { grid-column: 1; margin: 0; color: var(--ink-3); font-size: 14px; font-style: italic; }
  .pub-cites {
    grid-column: 2; grid-row: 1 / span 3; align-self: start; margin-top: 3px;
    font-size: 12.5px; color: var(--ink-3); text-align: right; white-space: nowrap; text-decoration: none;
    font-variant-numeric: tabular-nums;
  }
  .pub-cites b { display: block; font-size: 17px; color: var(--ink-2); font-weight: 600; }
  a.pub-cites:hover b, a.pub-cites:hover { color: var(--accent); }
  mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

  .flat .year-group { grid-template-columns: 1fr; padding-top: 8px; }
  .flat .year-label { display: none; }
  .flat .pub-venue::after { content: attr(data-year); font-style: normal; margin-left: 6px; }

  .empty, .notice { text-align: center; color: var(--ink-3); padding: 64px 0; }
  .notice code { background: var(--chip); padding: 2px 6px; border-radius: 6px; font-size: 13px; }

  footer { border-top: 1px solid var(--rule); padding: 24px 0 48px; color: var(--ink-3); font-size: 13px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 640px) {
    header { padding-top: 48px; }
    .year-group { grid-template-columns: 1fr; }
    .year-label { position: static; padding: 0 0 2px; font-size: 22px; }
    .pub { grid-template-columns: 1fr; }
    .pub-cites { grid-column: 1; grid-row: 4; text-align: left; margin-top: 2px; }
    .pub-cites b { display: inline; font-size: 13px; margin-right: 4px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="eyebrow">Forth Lab · Rensselaer Polytechnic Institute</p>
    <h1>Publications</h1>
    <p class="affil" id="affil">Cytoskeletal mechanics, microtubule-associated proteins, and the physical biology of cell division.</p>
    <div class="stats" id="stats" hidden></div>
    <a class="scholar-link" id="scholar-link" href="https://scholar.google.com/citations?user=Efwi0VsAAAAJ&amp;hl=en&amp;sortby=pubdate" target="_blank" rel="noopener">
      View on Google Scholar
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
    </a>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search titles, authors, journals…" autocomplete="off" aria-label="Search publications">
    </label>
    <div class="sortbtns" role="group" aria-label="Sort">
      <button type="button" data-sort="year" aria-pressed="true">Newest</button>
      <button type="button" data-sort="cites" aria-pressed="false">Most cited</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="wrap">
  <nav class="years" id="years" aria-label="Jump to year"></nav>
  <main id="list"><p class="empty">Loading publications…</p></main>
</div>

<footer>
  <div class="wrap">
    <span id="updated"></span>
    <span>Data from Google Scholar · refreshed automatically</span>
  </div>
</footer>

<script>
/* ---------- Configuration ---------- */
const CONFIG = {
  dataUrl: "publications.json",
  // Name variants to bold in author lists (case-insensitive).
  highlight: ["S Forth", "ST Forth", "S. Forth", "Scott Forth"],
  // Scholar entries to leave off the page (copy the "id" from publications.json).
  // The updater never touches this list, so hidden items stay hidden.
  hide: [
    "Efwi0VsAAAAJ:WC9gN4BGCRcC", // "Wednesday, February 6, 2013 551a" (mis-parsed abstract page)
    "Efwi0VsAAAAJ:6bLC7aUMtPcC", // "Supplemental material for Discontinuities…"
  ],
};
const AUTHOR = "Efwi0VsAAAAJ";
const viewUrl = (id) => `https://scholar.google.com/citations?view_op=view_citation&hl=en&user=${AUTHOR}&citation_for_view=${encodeURIComponent(id)}`;
const citesUrl = (c) => `https://scholar.google.com/scholar?oi=bibs&hl=en&cites=${encodeURIComponent(c)}`;

/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("en-US");
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const nameRe = new RegExp("(" + CONFIG.highlight.map(reEsc).join("|") + ")", "gi");

function highlightQuery(html, q) {
  if (!q) return html;
  // Only touch text outside of tags.
  const re = new RegExp("(" + reEsc(esc(q)) + ")", "gi");
  return html.replace(/(^|>)([^<]*)/g, (m, a, text) => a + text.replace(re, "<mark>$1</mark>"));
}

let DATA = { articles: [] };
let state = { q: "", sort: "year" };

function render() {
  const q = state.q.trim().toLowerCase();
  let items = DATA.articles.filter((a) =>
    !q || [a.title, a.authors, a.venue, a.year].join(" ").toLowerCase().includes(q)
  );

  if (state.sort === "cites") {
    items = [...items].sort((a, b) => (b.cited_by || 0) - (a.cited_by || 0));
  }
  // "year" order: articles are stored newest-first (Scholar's pubdate order); keep it, but
  // guarantee year ordering in case the data was edited by hand.
  else {
    items = items.map((a, i) => [a, i]).sort((x, y) => (Number(y[0].year) || 0) - (Number(x[0].year) || 0) || x[1] - y[1]).map((x) => x[0]);
  }

  $("#count").textContent = `${items.length} of ${DATA.articles.length}`;

  const list = $("#list");
  list.classList.toggle("flat", state.sort === "cites");
  if (!items.length) {
    list.innerHTML = `<p class="empty">No publications match “${esc(state.q)}”.</p>`;
    return;
  }

  const groups = [];
  for (const a of items) {
    const key = state.sort === "cites" ? "all" : (a.year || "Undated");
    let g = groups[groups.length - 1];
    if (!g || g.key !== key) groups.push((g = { key, items: [] }));
    g.items.push(a);
  }

  const raw = state.q.trim();
  list.innerHTML = groups.map((g) => `
    <section class="year-group" id="y-${esc(g.key)}">
      <div class="year-label">${esc(g.key)}</div>
      <ol class="pubs">
        ${g.items.map((a) => {
          const title = highlightQuery(esc(a.title), raw);
          const authors = highlightQuery(esc(a.authors).replace(nameRe, "<strong>$1</strong>"), raw);
          const venue = highlightQuery(esc(a.venue), raw);
          const link = a.link || (a.id ? viewUrl(a.id) : null);
          const cites = a.cited_by
            ? (a.cites_id
                ? `<a class="pub-cites" href="${esc(citesUrl(a.cites_id))}" target="_blank" rel="noopener" title="See citing papers on Google Scholar"><b>${fmt(a.cited_by)}</b>citation${a.cited_by === 1 ? "" : "s"}</a>`
                : `<span class="pub-cites"><b>${fmt(a.cited_by)}</b>citation${a.cited_by === 1 ? "" : "s"}</span>`)
            : `<span class="pub-cites"></span>`;
          return `<li class="pub">
            <h3 class="pub-title">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${title}</a>` : title}</h3>
            ${cites}
            <p class="pub-authors">${authors}</p>
            ${a.venue ? `<p class="pub-venue" data-year="${a.year ? "· " + esc(a.year) : ""}">${venue}</p>` : ""}
          </li>`;
        }).join("")}
      </ol>
    </section>`).join("");
}

function renderHeader() {
  const p = DATA.profile || {};
  if (p.url) $("#scholar-link").href = p.url;
  const m = DATA.metrics || {};
  const tiles = [
    ["Publications", DATA.articles.length],
    ["Citations", m.citations],
    ["h-index", m.h_index],
    ["i10-index", m.i10_index],
  ].filter(([, v]) => v != null);
  if (tiles.length) {
    $("#stats").innerHTML = tiles.map(([k, v]) => `<div class="stat"><b>${fmt(v)}</b><span>${k}</span></div>`).join("");
    $("#stats").hidden = false;
  }
  const years = [...new Set(DATA.articles.map((a) => a.year).filter(Boolean))].sort((a, b) => b - a);
  $("#years").innerHTML = years.map((y) => `<a href="#y-${y}">${y}</a>`).join("") +
    (DATA.articles.some((a) => !a.year) ? `<a href="#y-Undated">Undated</a>` : "");
  if (DATA.updated) {
    const d = new Date(DATA.updated);
    $("#updated").textContent = "Last updated " + d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  }
}

async function load() {
  try {
    const res = await fetch(CONFIG.dataUrl + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    const hidden = new Set(CONFIG.hide);
    DATA.articles = (DATA.articles || []).filter((a) => !hidden.has(a.id));
    renderHeader();
    render();
  } catch (e) {
    $("#list").innerHTML = `<div class="notice">
      <p>Couldn’t load <code>${esc(CONFIG.dataUrl)}</code>.</p>
      <p>If you opened this file directly from your computer, serve the folder instead
      (e.g. <code>python3 -m http.server</code>) or view it on the published site.</p></div>`;
    $("#years").innerHTML = "";
  }
}

let t;
$("#q").addEventListener("input", (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; render(); }, 80); });
document.querySelectorAll(".sortbtns button").forEach((b) =>
  b.addEventListener("click", () => {
    state.sort = b.dataset.sort;
    document.querySelectorAll(".sortbtns button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    $("#years").style.display = state.sort === "year" ? "" : "none";
    render();
  })
);
load();
</script>
</body>
</html>
